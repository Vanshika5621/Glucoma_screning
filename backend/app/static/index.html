<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fa">
    <title>Fundus Image Research Demo</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172b3a;
        background: #f5f7fa;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        --page: #f5f7fa;
        --surface: #fff;
        --text-muted: #4b5d6b;
        --border: #d6dee5;
        --primary: #155e63;
        --primary-hover: #10494d;
        --info-bg: #edf3f6;
        --warning-bg: #fff4e5;
        --warning-text: #713b00;
        --error-bg: #fceeee;
        --error-text: #8a2525;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        margin: 0;
        padding: 48px 24px;
      }

      main {
        width: min(100%, 760px);
        margin: 0 auto;
        padding: 32px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--surface);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(1.75rem, 5vw, 2rem);
        line-height: 1.2;
      }

      h2 {
        margin: 0 0 12px;
        font-size: 1.25rem;
        line-height: 1.3;
      }

      p {
        line-height: 1.55;
      }

      .intro,
      .help {
        color: var(--text-muted);
      }

      .section {
        margin-top: 32px;
      }

      .notice,
      .status {
        padding: 16px;
        border-radius: 8px;
      }

      .notice {
        margin-top: 24px;
        border-left: 4px solid #9a5700;
        background: var(--warning-bg);
        color: var(--warning-text);
      }

      .status {
        margin: 16px 0;
        background: var(--info-bg);
      }

      .status[data-state="error"] {
        background: var(--error-bg);
        color: var(--error-text);
      }

      .upload-box {
        padding: 24px;
        border: 1px dashed #82949e;
        border-radius: 8px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 650;
      }

      input[type="file"] {
        display: block;
        width: 100%;
        margin: 12px 0;
        color: var(--text-muted);
      }

      input[type="file"]::file-selector-button {
        min-height: 44px;
        margin-right: 12px;
        padding: 8px 14px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--surface);
        color: var(--text);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      button {
        min-height: 44px;
        padding: 10px 16px;
        border: 0;
        border-radius: 6px;
        background: var(--primary);
        color: #fff;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        background: var(--primary-hover);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.65;
      }

      :focus-visible {
        outline: 3px solid #176a9b;
        outline-offset: 3px;
      }

      #preview {
        display: none;
        max-width: min(100%, 360px);
        max-height: 360px;
        margin-top: 16px;
        border: 1px solid var(--border);
        border-radius: 8px;
        object-fit: contain;
      }

      a {
        color: var(--primary);
        text-underline-offset: 3px;
      }

      @media (max-width: 600px) {
        body {
          padding: 20px 16px;
        }

        main {
          padding: 20px;
        }

        .upload-box {
          padding: 16px;
        }

        button {
          width: 100%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Glaucoma screening</h1>

      <section class="section" aria-labelledby="upload-heading">
        <h2 id="upload-heading">Upload image</h2>
        <form id="upload-form" class="upload-box">
          <label for="fundus-image">Choose an image (up to 10 MB)</label>
          <input
            id="fundus-image"
            name="file"
            type="file"
            accept="image/*"
            required
            aria-describedby="upload-status"
          >
          <img id="preview" alt="Preview of the selected image">
          <p id="upload-status" class="status" role="status" aria-live="polite" hidden></p>
          <button id="submit-button" type="submit" disabled>Analyze image</button>
        </form>
      </section>

      <section class="section" aria-labelledby="prediction-heading">
        <h2 id="prediction-heading">Prediction</h2>
        <p id="result-message" class="status" role="status" aria-live="polite">
          Upload an image to see its prediction and confidence.
        </p>
        <div id="result-details" hidden>
          <p id="prediction-value" class="prediction" role="status" aria-live="polite"></p>
          <p>Confidence: <strong id="confidence-value"></strong></p>
          <p class="help">Model confidence, not certainty.</p>
        </div>
      </section>

      <p class="help">
        Research use only. Not for diagnosis or treatment.
      </p>
    </main>

    <script>
      const form = document.querySelector("#upload-form");
      const input = document.querySelector("#fundus-image");
      const uploadStatus = document.querySelector("#upload-status");
      const submitButton = document.querySelector("#submit-button");
      const preview = document.querySelector("#preview");
      const resultMessage = document.querySelector("#result-message");
      const resultDetails = document.querySelector("#result-details");
      const maxBytes = 10 * 1024 * 1024;
      let modelAvailable = false;
      let previewUrl = null;

      function showUploadStatus(message, isError = false) {
        uploadStatus.textContent = message;
        uploadStatus.hidden = !message;
        uploadStatus.dataset.state = isError ? "error" : "info";
      }

      fetch("/api/health")
        .then((response) => {
          if (!response.ok) {
            throw new Error("Unable to check application status.");
          }
          return response.json();
        })
        .then((health) => {
          modelAvailable = health.predictions_available;
          submitButton.disabled = !modelAvailable || !input.files[0];
          if (!modelAvailable) {
            resultMessage.textContent =
              "Prediction is unavailable because no model is loaded.";
          }
        })
        .catch(() => {
          resultMessage.textContent =
            "Prediction is unavailable because the app status could not be checked.";
        });

      input.addEventListener("change", () => {
        showUploadStatus("");
        resultDetails.hidden = true;
        resultMessage.hidden = false;
        resultMessage.textContent =
          "Upload an image to see its prediction and confidence.";
        if (previewUrl) {
          URL.revokeObjectURL(previewUrl);
          previewUrl = null;
        }
        preview.removeAttribute("src");
        preview.style.display = "none";
        submitButton.disabled = true;

        const file = input.files[0];
        if (!file) return;
        if (file.type && !file.type.startsWith("image/")) {
          input.value = "";
          showUploadStatus("Choose a supported retinal image.", true);
          return;
        }
        if (file.size > maxBytes) {
          input.value = "";
          showUploadStatus("The image is larger than 10 MB. Choose a smaller file.", true);
          return;
        }

        previewUrl = URL.createObjectURL(file);
        preview.src = previewUrl;
        preview.style.display = "block";
        submitButton.disabled = !modelAvailable;
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!modelAvailable || !input.files[0]) return;

        submitButton.disabled = true;
        showUploadStatus("Analyzing image…");
        resultMessage.hidden = true;
        resultDetails.hidden = true;
        const data = new FormData();
        data.append("file", input.files[0]);

        try {
          const response = await fetch("/api/predict", {
            method: "POST",
            body: data,
          });
          const result = await response.json();
          if (!response.ok) {
            throw new Error(result.detail || "The image could not be analyzed.");
          }
          const confidence = Number(result.confidence);
          if (!Number.isFinite(confidence)) {
            throw new Error("The prediction response did not include confidence.");
          }
          document.querySelector("#prediction-value").textContent =
            result.prediction === "glaucoma" ? "Yes" : "No";
          document.querySelector("#confidence-value").textContent =
            `${(confidence * 100).toFixed(1)}%`;
          resultDetails.hidden = false;
          showUploadStatus("");
        } catch (error) {
          showUploadStatus(
            error instanceof Error ? error.message : "The image could not be analyzed.",
            true
          );
          resultMessage.textContent = "No prediction is available.";
          resultMessage.hidden = false;
        } finally {
          submitButton.disabled = !modelAvailable || !input.files[0];
        }
      });

      window.addEventListener("pagehide", () => {
        if (previewUrl) URL.revokeObjectURL(previewUrl);
      });
    </script>
  </body>
</html>
